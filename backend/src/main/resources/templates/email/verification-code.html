<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${eyebrow}">Seu código</title>
</head>
<body style="margin:0; padding:0; background:#f7f7f4; font-family:'DM Sans', Arial, Helvetica, sans-serif; color:#20211f;">
<!-- prévia exibida na caixa de entrada -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;"
     th:text="|Seu código é ${code}. Ele vale por ${minutes} minutos.|">Seu código de confirmação</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f7f7f4;">
    <tr>
        <td align="center" style="padding:40px 16px;">

            <!-- marca -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                    <td style="vertical-align:middle; padding-right:10px;">
                        <img src="cid:logo" width="41" height="28" alt="" style="display:block; border:0;">
                    </td>
                    <td style="vertical-align:middle; font-family:'Manrope', Arial, Helvetica, sans-serif; font-size:17px; font-weight:800; letter-spacing:-0.4px; color:#20211f;">
                        Objetividade
                    </td>
                </tr>
            </table>

            <!-- cartão -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:440px; background:#ffffff; border:1px solid #e8e9e3; border-radius:20px;">
                <tr>
                    <td style="padding:38px 36px;">
                        <p style="margin:0 0 10px; color:#777b6e; font-size:11px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase;">
                            <span th:text="${eyebrow}">Confirme seu e-mail</span>
                        </p>

                        <h1 style="margin:0; font-family:'Manrope', Arial, Helvetica, sans-serif; font-size:26px; font-weight:800; letter-spacing:-1px; line-height:1.25; color:#20211f;"
                            th:text="|Olá, ${name}!|">Olá!</h1>

                        <p style="margin:12px 0 26px; color:#858780; font-size:14px; line-height:1.7;"
                           th:text="${intro}">Use o código abaixo para concluir seu cadastro.</p>

                        <!-- código -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center"
                                    style="padding:20px 12px; background:#fcfcfa; border:1px solid #e8e9e3; border-radius:12px;">
                                    <span style="font-family:'Manrope', Arial, Helvetica, sans-serif; font-size:34px; font-weight:800; letter-spacing:10px; padding-left:10px; color:#20211f;"
                                          th:text="${code}">000000</span>
                                </td>
                            </tr>
                        </table>

                        <!-- validade -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:18px;">
                            <tr>
                                <td style="background:#c9f269; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; color:#20211f;"
                                    th:text="|Válido por ${minutes} minutos|">Válido por 15 minutos</td>
                            </tr>
                        </table>

                        <p style="margin:26px 0 0; padding-top:20px; border-top:1px solid #e8e9e3; color:#858780; font-size:12px; line-height:1.6;">
                            <span th:text="${ignoreNote}">Se você não pediu este cadastro, é só ignorar este e-mail.</span>
                            Nunca compartilhe este código com ninguém.
                        </p>
                    </td>
                </tr>
            </table>

            <p style="margin:24px 0 0; color:#a5a69f; font-size:12px;">
                Comece com o essencial. Evolua no seu ritmo.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
