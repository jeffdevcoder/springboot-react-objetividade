spring.datasource.url=jdbc:h2:file:./data/checklist
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always

spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=365d
server.servlet.session.cookie.max-age=365d
server.servlet.session.cookie.http-only=true

# Secure: o cookie só trafega por HTTPS (navegadores aceitam em http://localhost).
# Para testar pelo IP da rede sem HTTPS, rode com COOKIE_SECURE=false.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
