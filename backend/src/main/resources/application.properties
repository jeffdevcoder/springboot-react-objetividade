spring.datasource.url=jdbc:h2:file:./data/checklist
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always

spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=365d
server.servlet.session.cookie.max-age=365d
server.servlet.session.cookie.http-only=true

# Secure: o cookie só trafega por HTTPS (navegadores aceitam em http://localhost).
# Para testar pelo IP da rede sem HTTPS, rode com COOKIE_SECURE=false.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# E-mail (confirmação de cadastro). Sem MAIL_HOST, o código só aparece no log (modo desenvolvimento).
# Para testar localmente com envio real, crie backend/mail.local.properties (ignorado pelo git).
# (procura em backend/ e na raiz do projeto, pois o IntelliJ roda a partir da raiz)
spring.config.import=optional:file:./mail.local.properties,optional:file:./backend/mail.local.properties
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
